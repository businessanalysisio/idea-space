<div id="label-manager">
  <h3>Manage labels</h3>
  <form hx-post="/labels" hx-target="#label-manager" hx-swap="outerHTML">
    <input type="text" name="name" placeholder="New label name" required>
    <input type="color" name="color" value="#6b7280">
    <button type="submit">Add label</button>
  </form>
  <ul class="label-manager-list">
    {% for label in all_labels|default([]) %}
    <li>
      <span class="label-chip" style="background-color: {{ label.color }};">{{ label.name }}</span>
      <form hx-patch="/labels/{{ label.id }}" hx-target="#label-manager" hx-swap="outerHTML" style="display:inline">
        <input type="text" name="name" value="{{ label.name }}" size="10">
        <button type="submit">Rename</button>
      </form>
      <button hx-delete="/labels/{{ label.id }}" hx-target="#label-manager" hx-swap="outerHTML">Delete</button>
    </li>
    {% endfor %}
  </ul>
</div>
